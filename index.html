  <script type="text/babel">
    function SwipeableTransaction({ tx, onDelete, onEdit, onResolveDebt }) {
      const [offsetX, setOffsetX] = React.useState(0);
      const [isSwiped, setIsSwiped] = React.useState(false);
      const startXRef = React.useRef(0);

      const handleStart = (clientX) => { startXRef.current = clientX; };
      const handleMove = (clientX) => {
        const diff = clientX - startXRef.current;
        if (diff < -5 && diff > -130) { setOffsetX(diff); } 
        else if (diff > 5 && isSwiped) { setOffsetX(0); setIsSwiped(false); }
      };
      const handleEnd = () => {
        if (offsetX < -60) { setIsSwiped(true); setOffsetX(-120); } 
        else { setIsSwiped(false); setOffsetX(0); }
      };

      const getColorClass = (type) => {
        if (type === 'income') return 'income';
        if (type === 'expense') return 'expense';
        if (type === 'lend') return 'lend';
        if (type === 'borrow') return 'borrow';
        if (type === 'partial_payment') return 'partial';
        return 'transfer';
      };

      return (
        <div style={{ position: 'relative', overflow: 'hidden', marginBottom: '10px', borderRadius: '16px' }}>
          <div style={{ position: 'absolute', top: 0, right: 0, bottom: 0, width: '120px', display: 'flex', zIndex: 0, borderRadius: '16px', overflow: 'hidden', backgroundColor: '#E5EBE7' }}>
            <div style={{ flex: 1, backgroundColor: '#EDF2F7', color: '#4A5568', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }} onClick={() => onDelete(tx.id)} title="Delete">
              <span className="material-icons" style={{ fontSize: '20px', color: '#E53E3E' }}>delete</span>
            </div>
            <div style={{ flex: 1, backgroundColor: '#EDF2F7', color: '#4A5568', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }} onClick={() => onEdit(tx)} title="Edit">
              <span className="material-icons" style={{ fontSize: '20px', color: '#4A5568' }}>edit</span>
            </div>
          </div>
          
          <div 
            onTouchStart={(e) => handleStart(e.touches[0].clientX)}
            onTouchMove={(e) => handleMove(e.touches[0].clientX)}
            onTouchEnd={handleEnd}
            onMouseDown={(e) => handleStart(e.clientX)}
            onMouseMove={(e) => { if (e.buttons === 1) handleMove(e.clientX) }}
            onMouseUp={handleEnd}
            onMouseLeave={handleEnd}
            className="t-item"
            style={{ transform: `translateX(${isSwiped ? -120 : (offsetX < 0 ? offsetX : 0)}px)`, transition: isSwiped || offsetX === 0 ? 'transform 0.3s ease' : 'none', position: 'relative', zIndex: 1, userSelect: 'none', margin: 0 }}
          >
            <div className="t-info" style={{ display: 'flex', alignItems: 'center', gap: '12px', width: '68%' }}>
              {(tx.type === 'lend' || tx.type === 'borrow') && (
                <button 
                  className="icon-btn" 
                  title={tx.resolved ? 'Settled' : 'Partial / Settle Payment'}
                  onClick={(e) => { e.stopPropagation(); onResolveDebt(tx); }}
                  style={{ background: tx.resolved ? '#16845B' : '#F6F8F7', color: tx.resolved ? 'white' : '#16845B', border: 'none', borderRadius: '50%', width: '32px', height: '32px', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}
                >
                  <span className="material-icons" style={{ fontSize: '18px' }}>{tx.resolved ? 'task_alt' : 'payments'}</span>
                </button>
              )}
              <div>
                <h4 style={{ color: '#102A43' }}>{tx.title}</h4>
                <p>
                  {tx.type === 'transfer' ? (
                    <span className="t-tag" style={{background: '#EBF8FF', color: '#2B6CB0'}}>
                      {tx.fromWallet} ➔ {tx.toWallet} {tx.charge ? `(Chg: ৳${tx.charge})` : ''}
                    </span>
                  ) : tx.type === 'lend' || tx.type === 'borrow' ? (
                    <span className="t-tag" style={{background: tx.resolved ? '#E6FFFA' : '#F6F8F7', color: tx.resolved ? '#16845B' : '#718096'}}>
                      {tx.wallet} ({tx.type === 'lend' ? 'Lend' : 'Borrow'}) {tx.resolved ? '• [Paid Full]' : `• Due: ৳${tx.remainingBalance !== undefined ? tx.remainingBalance : tx.amount}`}
                    </span>
                  ) : tx.type === 'partial_payment' ? (
                    <span className="t-tag" style={{background: '#FEFCBF', color: '#B7791F'}}>
                      Partial Pay • {tx.wallet} (Ref: {tx.parentTitle})
                    </span>

        if (dataStr) {
          try {
            const data = JSON.parse(dataStr);
            if (data.type === type) sourceIndex = data.index;
          } catch(err) {}
        }

        if (sourceIndex === null || sourceIndex === targetIndex) return;

        const updated = [...list];
        const [movedItem] = updated.splice(sourceIndex, 1);
        updated.splice(targetIndex, 0, movedItem);
        setList(updated);
        setDraggedIndex(null);
      };

      // Mobile Touch Drag Helpers

        setDraggedIndex(index);

          return;

        const [movedItem] = updated.splice(draggedIndex, 1);

      const getPeriodLabel = (filterKey) => {
        const now = new Date();

        if (filterKey === 'monthly') {
          const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
          return `01 - ${lastDay} ${mNames[now.getMonth()]}`;
        } else if (filterKey === 'previous_month') {
          const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          const lastDay = new Date(prev.getFullYear(), prev.getMonth() + 1, 0).getDate();
          return `01 - ${lastDay} ${mNames[prev.getMonth()]}`;
        } else if (filterKey === 'yearly') {

      const filterByPeriod = (txList, filterKey) => {

          if (filterKey === 'monthly') {
            return tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear();
          } else if (filterKey === 'previous_month') {
            const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            return tDate.getMonth() === prev.getMonth() && tDate.getFullYear() === prev.getFullYear();
          } else if (filterKey === 'yearly') {
            return tDate.getFullYear() === now.getFullYear();
          } else if (filterKey === 'custom' && customDateFrom && customDateTo) {
            return t.rawDate >= customDateFrom && t.rawDate <= customDateTo;
          }
          return true; 
        });

            }

          txCountByWallet[t.wallet] = (txCountByWallet[t.wallet] || 0) + 1;

        }

        const newTxs = entries.map((entry, index) => {
          let defaultTitle = entry.type === 'transfer' ? 'Cash Out' : entry.type === 'lend' ? 'Lend' : entry.type === 'borrow' ? 'Borrow' : entry.type === 'income' ? 'Salary month' : entry.category;
          let finalTitle = entry.title.trim() || defaultTitle;
          const selectedDate = new Date(entry.date);
          const displayDate = selectedDate.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
          const amt = parseFloat(entry.amount);

          return {
            id: entry.id ? entry.id : (Date.now() + index), 
            title: finalTitle,
            amount: amt,
            type: entry.type,
            category: entry.type === 'transfer' || entry.type === 'lend' || entry.type === 'borrow' ? 'General' : entry.category,
            wallet: entry.wallet,
            fromWallet: entry.fromWallet,
            toWallet: entry.toWallet,
            charge: entry.type === 'transfer' && entry.useCharge ? parseFloat(entry.charge || 0) : 0,
            ...(entry.type === 'lend' || entry.type === 'borrow' ? { remainingBalance: amt } : {}),
            payments: [],
            date: displayDate,
            rawDate: entry.date,
            resolved: false
          };
        });

        const editedIds = entries.filter(e => e.id).map(e => e.id);
        const filteredTxs = transactions.filter(t => !editedIds.includes(t.id));

        const updatedTransactions = [...newTxs, ...filteredTxs];
        updatedTransactions.sort((a, b) => new Date(b.rawDate) - new Date(a.rawDate));
        setTransactions(updatedTransactions);
        setEntries([{ ...defaultEntry }]);
        setActiveTab('home'); 
      };

      const handleDelete = (id) => {
        const txToDelete = transactions.find(t => t.id === id);
        if (txToDelete && (txToDelete.type === 'lend' || txToDelete.type === 'borrow')) {
          setTransactions(transactions.filter(tx => tx.id !== id && tx.parentId !== id));
        } else if (txToDelete && txToDelete.type === 'partial_payment') {
          const updated = transactions.map(t => {
            if (t.id === txToDelete.parentId) {
              const currentDue = t.remainingBalance !== undefined ? t.remainingBalance : t.amount;
              const restoredDue = currentDue + txToDelete.amount;
              const paymentsList = t.payments ? t.payments.filter(p => p.amount !== txToDelete.amount) : [];
              return {
                ...t,
                remainingBalance: restoredDue,
                resolved: false,
                payments: paymentsList
              };
            }
            return t;
          });
          setTransactions(updated.filter(tx => tx.id !== id));
        } else {
          setTransactions(transactions.filter(tx => tx.id !== id));
        }
      };

      const handleEdit = (tx) => {
        setEntries([{
          id: tx.id,
          title: tx.title,
          amount: tx.amount,
          type: tx.type,
          category: tx.category,
          wallet: tx.wallet || allAccountOptions[0],
          fromWallet: tx.fromWallet || wallets[0],
          toWallet: tx.toWallet || wallets[1],
          useCharge: !!tx.charge,
          charge: tx.charge || '',
          date: tx.rawDate || getTodayDate()
        }]);
        setActiveTab('transactions');
      };

      const confirmPartialPayment = () => {
        if (!resolvingTx || !partialAmount || !partialDate) {
          return alert('Please provide both payment amount and payment date!');
        }
        const payAmt = parseFloat(partialAmount);
        const currentDue = resolvingTx.remainingBalance !== undefined ? resolvingTx.remainingBalance : resolvingTx.amount;

        if (payAmt <= 0 || payAmt > currentDue) {
          return alert('Please enter a valid partial or full amount within the due limit!');
        }

        const newDue = currentDue - payAmt;
        const isFullyPaid = newDue <= 0;
        const selDateObj = new Date(partialDate);
        const formattedDate = selDateObj.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
        const isLendPay = resolvingTx.type === 'lend';

        const paymentTx = {
          id: Date.now(),
          title: `${isLendPay ? 'Received from' : 'Paid to'} ${resolvingTx.title}`,
          amount: payAmt,
          type: 'partial_payment',
          category: 'General',
          wallet: resolveWallet,
          parentTitle: resolvingTx.title,
          parentId: resolvingTx.id,
          isLendPay: isLendPay,
          date: formattedDate,
          rawDate: partialDate,
          resolved: true
        };

        const updatedTxs = transactions.map(t => {
          if (t.id === resolvingTx.id) {
            const existingPayments = t.payments ? [...t.payments] : [];
            return {
              ...t,
              remainingBalance: newDue,
              resolved: isFullyPaid,
              payments: [{ amount: payAmt, date: formattedDate, wallet: resolveWallet }, ...existingPayments]
            };
          }
          return t;
        });

        setTransactions([paymentTx, ...updatedTxs]);
        setResolvingTx(null);
        setPartialAmount('');
        setPartialDate('');
        if (historyModalItem && historyModalItem.id === resolvingTx.id) {
          setHistoryModalItem(updatedTxs.find(t => t.id === resolvingTx.id));
        }
      };

      const handleWalletBalanceCorrection = () => {
        if (!walletToCorrect || correctBalanceInput === '') return;
        const targetWallet = walletToCorrect;
        const currentBal = walletBalances[targetWallet] || 0;
        const newBal = parseFloat(correctBalanceInput);
        const diff = newBal - currentBal;

        if (diff === 0) {
          setWalletToCorrect(null);
          setCorrectBalanceInput('');
          return;
        }

        const correctionTx = {
          id: Date.now(),
          title: `Balance Correction (${targetWallet})`,
          amount: diff,
          type: 'correction',
          category: 'General',
          wallet: targetWallet,
          date: new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }),
          rawDate: getTodayDate(),
          resolved: true
        };

        setTransactions([correctionTx, ...transactions]);
        setWalletToCorrect(null);
        setCorrectBalanceInput('');
        setDrilldownType(null); 
      };

      const handleItemEditPrompt = (list, setList, item, typeName) => {
        setEditingItem({ listType: typeName, oldName: item });
        setEditInputVal(item);
      };

      const saveEditedItem = () => {
        if (!editingItem || !editInputVal.trim()) return;
        const val = editInputVal.trim();
        const { listType, oldName } = editingItem;

        if (listType === 'wallet') {
          if (wallets.includes(val)) return alert('Already exists!');
          setWallets(wallets.map(w => w === oldName ? val : w));
          setTransactions(transactions.map(t => ({
            ...t,
            wallet: t.wallet === oldName ? val : t.wallet,
            fromWallet: t.fromWallet === oldName ? val : t.fromWallet,
            toWallet: t.toWallet === oldName ? val : t.toWallet,
            resolveWallet: t.resolveWallet === oldName ? val : t.resolveWallet
          })));
        } else if (listType === 'savings') {
          if (savingsList.includes(val)) return alert('Already exists!');
          setSavingsList(savingsList.map(s => s === oldName ? val : s));
          setTransactions(transactions.map(t => ({
            ...t,
            wallet: t.wallet === oldName ? val : t.wallet,
            fromWallet: t.fromWallet === oldName ? val : t.fromWallet,
            toWallet: t.toWallet === oldName ? val : t.toWallet
          })));
        } else if (listType === 'exp_cat') {
          if (expenseCategories.includes(val)) return alert('Already exists!');
          setExpenseCategories(expenseCategories.map(c => c === oldName ? val : c));
          setTransactions(transactions.map(t => t.category === oldName ? { ...t, category: val } : t));
        } else if (listType === 'inc_cat') {
          if (incomeCategories.includes(val)) return alert('Already exists!');
          setIncomeCategories(incomeCategories.map(c => c === oldName ? val : c));
          setTransactions(transactions.map(t => t.category === oldName ? { ...t, category: val } : t));
        }
        setEditingItem(null);
        setEditInputVal('');
      };

      const pressTimer = React.useRef(null);
      let isLongPress = false;
      
      const handlePressStart = (cardName) => {
        isLongPress = false;
        pressTimer.current = setTimeout(() => {
          isLongPress = true;
          setActiveFilterCard(cardName);
        }, 500); 
      };
      
      const handlePressEnd = () => {
        if (pressTimer.current) clearTimeout(pressTimer.current);
      };
      
      const renderGridByKey = (key) => {
        switch (key) {

            return visibleGrids.netWorth && (
              <div

                className="net-worth-card"
                onClick={(e) => { if (!isLongPress) { setDrilldownType('netWorth'); setDrilldownKey(null); setDrilldownFilter(filters.netWorth); } }}
                onTouchStart={() => handlePressStart('netWorth')}
                onTouchEnd={handlePressEnd}
                onMouseDown={() => handlePressStart('netWorth')}

                onContextMenu={(e) => { e.preventDefault(); setActiveFilterCard('netWorth'); }}

                  <span>{getFilterName(filters.netWorth)}</span>

          case 'incExp':

                  onMouseLeave={handlePressEnd}
                  onContextMenu={(e) => { e.preventDefault(); setActiveFilterCard('incExp'); }}
                >
                  <div className="ie-title"><span className="material-icons" style={{fontSize: '15px', color: '#D94848'}}>trending_down</span> Expense</div>
                  <h3>৳ {totalExpense.toLocaleString()}</h3>

                    <span>×{expCount}</span>

                <div

                  onMouseDown={() => handlePressStart('incExp')}
                  onMouseUp={handlePressEnd}
                  onMouseLeave={handlePressEnd}
                  onContextMenu={(e) => { e.preventDefault(); setActiveFilterCard('incExp'); }}
                >
                  <div className="ie-title"><span className="material-icons" style={{fontSize: '15px', color: '#16845B'}}>trending_up</span> Income</div>
                  <h3>৳ {totalIncome.toLocaleString()}</h3>
                  <div className="ie-footer">
                    <span>×{incCount}</span>
                    <span>{getFilterName(filters.incExp)}</span>
                  </div>
                </div>
              </div>
            );
          case 'lendBorrow':
            return visibleGrids.lendBorrow && (
              <div key="lendBorrow" className="grid-2-container">
                <div 
                  className="ie-card" 
                  style={{margin: 0, padding: '14px', cursor: 'pointer'}} 
                  onClick={() => { if(!isLongPress) { setDrilldownType('lend'); setDrilldownKey(null); setDrilldownFilter(filters.lendBorrow); } }}
                  onTouchStart={() => handlePressStart('lendBorrow')}
                  onTouchEnd={handlePressEnd}
                  onMouseDown={() => handlePressStart('lendBorrow')}
                  onMouseUp={handlePressEnd}
                  onMouseLeave={handlePressEnd}
                  onContextMenu={(e) => { e.preventDefault(); setActiveFilterCard('lendBorrow'); }}
                >
                  <div className="top-row" style={{marginBottom: '2px', display: 'flex', justifyContent: 'space-between', color: '#718096', fontSize: '12px'}}>
                    <span style={{color: '#2B6CB0', fontWeight: '600'}}>📥 Lent</span>
                  </div>
                  <h3 style={{fontSize: '18px', color: '#2B6CB0', fontWeight: '700', marginTop: '4px'}}>৳ {dispTotalLend.toLocaleString()}</h3>
                  <div className="ie-footer" style={{ borderTop: 'none', paddingTop: '0' }}>
                    <span>×{lendCount}</span>
                    <span>{getFilterName(filters.lendBorrow)}</span>
                  </div>
                </div>
                <div 
                  className="ie-card" 
                  style={{margin: 0, padding: '14px', cursor: 'pointer'}} 
                  onClick={() => { if(!isLongPress) { setDrilldownType('borrow'); setDrilldownKey(null); setDrilldownFilter(filters.lendBorrow); } }}
                  onTouchStart={() => handlePressStart('lendBorrow')}
                  onTouchEnd={handlePressEnd}
                  onMouseDown={() => handlePressStart('lendBorrow')}
                  onMouseUp={handlePressEnd}
                  onMouseLeave={handlePressEnd}
                  onContextMenu={(e) => { e.preventDefault(); setActiveFilterCard('lendBorrow'); }}
                >
                  <div className="top-row" style={{marginBottom: '2px', display: 'flex', justifyContent: 'space-between', color: '#718096', fontSize: '12px'}}>
                    <span style={{color: '#805AD5', fontWeight: '600'}}>📤 Borrowed</span>
                  </div>
                  <h3 style={{fontSize: '18px', color: '#805AD5', fontWeight: '700', marginTop: '4px'}}>৳ {dispTotalBorrow.toLocaleString()}</h3>
                  <div className="ie-footer" style={{ borderTop: 'none', paddingTop: '0' }}>
                    <span>×{borrowCount}</span>
                    <span>{getFilterName(filters.lendBorrow)}</span>
                  </div>
                </div>
              </div>
            );
          case 'categoryReport':
            return visibleGrids.categoryReport && (
              <div key="categoryReport" className="category-report">
                <div style={{fontSize: '14px', fontWeight: '700', color: '#102A43', marginBottom: '10px'}}>Expense by Category ({getFilterName(filters.incExp)})</div>
                {sortedExpenses.length === 0 ? (
                  <p style={{ color: '#718096', textAlign: 'center', fontSize: '12px' }}>No expense data available.</p>
                ) : (
                  sortedExpenses.map(([cat, amount]) => {
                    const percentage = totalExpense > 0 ? ((amount / totalExpense) * 100).toFixed(1) : 0;
                    return (
                      <div key={cat} className="cat-bar-container">
                        <div className="cat-header">
                          <span>{cat}</span>
                          <span>৳ {amount.toLocaleString()} ({percentage}%)</span>
                        </div>
                        <div className="cat-bg">
                          <div className="cat-fill" style={{ width: `${percentage}%` }}></div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            );
          case 'transactions':
            return visibleGrids.transactions && (
              <div key="transactions">
                <div style={{fontSize: '14px', fontWeight: '700', color: '#102A43', marginBottom: '8px'}}>Recent Transactions</div>
                {transactions.length === 0 && <p style={{color: '#718096', textAlign: 'center'}}>No transactions found.</p>}
                {transactions.map((tx) => (
                  <SwipeableTransaction key={tx.id} tx={tx} onDelete={handleDelete} onEdit={handleEdit} onResolveDebt={(t) => {
                    setResolvingTx(t);
                    setResolveWallet(allAccountOptions[0]);
                    setPartialAmount(t.remainingBalance !== undefined ? t.remainingBalance : t.amount);
                    setPartialDate(getTodayDate());
                  }} />
                ))}
              </div>
            );
          default:
            return null;
        }
      };

      if (authLoading) {
        return (
          <div className="loading-container">

            <div className="spinner"></div>
            <p style={{ marginTop: '15px', color: '#718096' }}>Loading your account...</p>
          </div>
        );
      }


      if (!currentUser && !isGuest) {
        return (
          <div style={{ minHeight: '100vh', width: '100%', background: '#F6F8F7', padding: '16px 12px', display: 'flex', alignItems: 'center', justifyContent: 'center', boxSizing: 'border-box' }}>
            <div style={{ width: '100%', maxWidth: '340px', boxSizing: 'border-box', textAlign: 'center' }}>
              <div style={{ marginBottom: '20px' }}>
                <h1 style={{ color: '#102A43', fontSize: 'clamp(26px, 6vw, 34px)', fontWeight: 'bold', letterSpacing: '-1px', margin: '0 0 6px' }}>OrthoGro</h1>
                <div style={{ color: '#16845B', fontSize: 'clamp(13px, 3.5vw, 18px)', fontWeight: 'bold', letterSpacing: '1.5px', marginBottom: '6px' }}>TRACK • SAVE • GROW</div>
                <p style={{ color: '#718096', fontSize: 'clamp(12px, 3vw, 15px)', margin: 0 }}>Personal Finance & Wealth Management</p>
              </div>
              <div style={{ width: '100%', background: '#FFFFFF', border: '1.5px solid #DDE5E1', borderRadius: '26px', padding: '22px 14px 22px', boxSizing: 'border-box', textAlign: 'center', boxShadow: '0 4px 16px rgba(16,42,67,0.03)' }}>
                <div style={{ width: '60px', height: '60px', borderRadius: '50%', background: '#E8F5EE', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 14px' }}>
                  <svg width="26" height="26" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 4L41 11V22C41 33 34 41 24 45C14 41 7 33 7 22V11L24 4Z" stroke="#16845B" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M16 24L22 30L33 18" stroke="#16845B" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
                <h2 style={{ color: '#102A43', fontSize: 'clamp(20px, 4vw, 26px)', fontWeight: 'bold', margin: '0 0 6px' }}>Welcome Back!</h2>
                <p style={{ color: '#718096', fontSize: 'clamp(12px, 2.8vw, 15px)', lineHeight: '1.4', margin: '0 auto 18px', maxWidth: '280px' }}>Sign in to access your personal financial dashboard.</p>
                <button onClick={handleGoogleLogin} style={{ width: '92%', minHeight: '48px', padding: '10px', background: '#16845B', color: '#FFFFFF', border: 'none', borderRadius: '14px', fontSize: 'clamp(14px, 3vw, 16px)', fontWeight: 'bold', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', margin: '0 auto 12px', boxSizing: 'border-box' }}>
                  <span className="material-icons" style={{ fontSize: '20px' }}>login</span> Sign In with Google

                <button onClick={handleGuestLogin} style={{ width: '82%', minHeight: '42px', padding: '8px', background: '#FFFFFF', color: '#287F65', border: '2px solid #287F65', borderRadius: '12px', fontSize: 'clamp(13px, 2.8vw, 15px)', fontWeight: 'bold', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', margin: '0 auto', boxSizing: 'border-box' }}>

                </button>

      return (

            </div>
            <div className="header-actions">
              <button className="header-icon" title="Organize Home Grids" onClick={() => setShowCustomizeModal(true)}>
                <span className="material-icons">more_vert</span>
              </button>
            </div>
          </header>

          <main className="content">
            {activeTab === 'home' && (
              <div>
                {gridOrder.map(key => renderGridByKey(key))}
              </div>
            )}
            
            
 
          {/* --- BAZAR MEMO / NOTEPAD TAB --- */}
{activeTab === 'memo' && (
  <div className="page" style={{ width: '100%', position: 'relative', paddingBottom: '90px' }}>
    <div className="tab-selector">
      <button className={`tab-btn ${memoActiveTab === 'memo' ? 'active' : ''}`} onClick={() => setMemoActiveTab('memo')}>Bazar Memo</button>

                    }} style={{padding: '10px 0', borderBottom: '1px solid #E5EBE7', display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: (tx.type === 'lend' || tx.type === 'borrow') ? 'pointer' : 'default'}}>
                      <div>
                        <h4 style={{fontSize: '13px', fontWeight: 'bold'}}>{tx.title} {tx.type === 'lend' || tx.type === 'borrow' ? `(Due: ৳${tx.remainingBalance !== undefined ? tx.remainingBalance : tx.amount})` : ''}</h4>
                        <p style={{fontSize: '11px', color: '#718096'}}>{tx.date} • {tx.wallet || tx.fromWallet} {(tx.type === 'lend' || tx.type === 'borrow') ? '🖱️ Tap for History' : ''}</p>
                      </div>
                      <span style={{fontWeight: 'bold', fontSize: '14px', color: tx.type === 'expense' ? '#D94848' : '#102A43'}}>
                        {tx.type === 'expense' || tx.type === 'lend' ? '-' : '+'} ৳ {tx.amount.toLocaleString()}
                      </span>
                    </div>
                  ));
                })()}
                <button className="btn-submit" style={{ marginTop: '16px', padding: '10px' }} onClick={() => setDrilldownType(null)}>Close</button>
              </div>
            </div>
          )}

          {activeFilterCard && (
            <div className="modal-overlay" onClick={() => setActiveFilterCard(null)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <h3 style={{ marginBottom: '14px', color: '#16845B' }}>Select Time Period</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '12px' }}>
                  <button className="btn-submit" style={{ padding: '12px', background: filters[activeFilterCard] === 'all' ? '#16845B' : '#CBD5E0' }} onClick={() => { setFilters({...filters, [activeFilterCard]: 'all'}); setActiveFilterCard(null); }}>All Time</button>
                  <button className="btn-submit" style={{ padding: '12px', background: filters[activeFilterCard] === 'monthly' ? '#16845B' : '#CBD5E0' }} onClick={() => { setFilters({...filters, [activeFilterCard]: 'monthly'}); setActiveFilterCard(null); }}>This Month</button>
                  <button className="btn-submit" style={{ padding: '12px', background: filters[activeFilterCard] === 'previous_month' ? '#16845B' : '#CBD5E0' }} onClick={() => { setFilters({...filters, [activeFilterCard]: 'previous_month'}); setActiveFilterCard(null); }}>Previous Month</button>
                  <button className="btn-submit" style={{ padding: '12px', background: filters[activeFilterCard] === 'yearly' ? '#16845B' : '#CBD5E0' }} onClick={() => { setFilters({...filters, [activeFilterCard]: 'yearly'}); setActiveFilterCard(null); }}>Current Year</button>
                </div>
                <div style={{ borderTop: '1px solid #E5EBE7', paddingTop: '10px' }}>
                  <label style={{ fontSize: '12px', fontWeight: '600', color: '#718096', display: 'block', marginBottom: '6px' }}>Custom Range:</label>
                  <div style={{ display: 'flex', gap: '6px', marginBottom: '8px' }}>
                    <input type="date" className="form-control" value={customDateFrom} onChange={(e) => setCustomDateFrom(e.target.value)} />
                    <input type="date" className="form-control" value={customDateTo} onChange={(e) => setCustomDateTo(e.target.value)} />
                  </div>
                  <button className="btn-submit" style={{ padding: '10px', background: '#2B6CB0' }} onClick={() => { if(customDateFrom && customDateTo) { setFilters({...filters, [activeFilterCard]: 'custom'}); setActiveFilterCard(null); } else { alert('Please select both dates'); } }}>Apply Custom</button>
                </div>
              </div>
            </div>
          )}

          {editingItem && (
            <div className="modal-overlay" onClick={() => setEditingItem(null)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <h3 style={{ marginBottom: '12px', color: '#16845B' }}>Edit Name</h3>
                <div className="form-group">
                  <label>New Name</label>
                  <input type="text" className="form-control" value={editInputVal} onChange={(e) => setEditInputVal(e.target.value)} />
                </div>
                <button className="btn-submit" style={{ marginTop: '12px', padding: '10px' }} onClick={saveEditedItem}>Save</button>
                <button className="btn-submit" style={{ marginTop: '8px', padding: '10px', background: '#A0AEC0' }} onClick={() => setEditingItem(null)}>Cancel</button>
              </div>
            </div>
          )}

          {walletToCorrect && (
            <div className="modal-overlay" onClick={() => setWalletToCorrect(null)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <h3 style={{ marginBottom: '8px', color: '#16845B' }}>Correct Balance: {walletToCorrect}</h3>
                <p style={{ fontSize: '12px', color: '#718096', marginBottom: '12px' }}>
                  Previous Balance: <strong style={{ color: '#102A43' }}>৳ {(walletBalances[walletToCorrect] || 0).toLocaleString()}</strong>
                </p>
                <div className="form-group">
                  <label>New Correct Balance (৳)</label>
                  <input type="number" className="form-control" value={correctBalanceInput} onChange={(e) => setCorrectBalanceInput(e.target.value)} />
                </div>
                <button className="btn-submit" style={{ marginTop: '12px', padding: '10px' }} onClick={handleWalletBalanceCorrection}>Save Correction</button>
                <button className="btn-submit" style={{ marginTop: '8px', padding: '10px', background: '#A0AEC0' }} onClick={() => setWalletToCorrect(null)}>Cancel</button>
              </div>
            </div>
          )}

          {showCustomizeModal && (
            <div className="modal-overlay" onClick={() => setShowCustomizeModal(false)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <h3 style={{ marginBottom: '10px', color: '#16845B' }}>Organize & Reorder Home Grids</h3>
                <p style={{ fontSize: '11px', color: '#718096', marginBottom: '14px' }}>Drag and drop items to reorder them on your home screen.</p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '15px' }} onDragOver={handleDragOver}>
                  {gridOrder.map((key, idx) => {
                    const labelNames = {
                      netWorth: 'Net Worth Grid',
                      wallets: 'Wallet Balance Grid',
                      savings: 'Deposit & Investment Grid',
                      incExp: 'Income & Expense Grid',
                      lendBorrow: 'Lend & Borrow Grid',
                      categoryReport: 'Category Expense Report',
                      transactions: 'Recent Transactions List'
                    };
                    return (
                      <div key={key} draggable onDragStart={(e) => handleDragStart(e, idx, 'grid')} onDrop={(e) => handleDrop(e, idx, 'grid', gridOrder, setGridOrder)} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#F6F8F7', padding: '10px 12px', borderRadius: '10px', border: '1px solid #E5EBE7', cursor: 'grab' }}>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '13px', cursor: 'pointer', flex: 1, color: '#102A43', fontWeight: '500' }}>
                          <input type="checkbox" checked={visibleGrids[key]} onChange={() => toggleGrid(key)} style={{ width: '16px', height: '16px', accentColor: '#16845B' }} />
                          {labelNames[key]}
                        </label>
                        <span className="material-icons" style={{ fontSize: '20px', color: '#A0AEC0' }}>drag_indicator</span>
                      </div>
                    );
                  })}
                </div>
                <button className="btn-submit" style={{ padding: '10px' }} onClick={() => setShowCustomizeModal(false)}>Done</button>
              </div>
            </div>
          )}

          <nav className="bottom-nav">
            <button className={activeTab === 'home' ? 'active' : ''} onClick={() => setActiveTab('home')}>
              <span className="material-icons">home</span>Home
            </button>
            <button className={activeTab === 'memo' ? 'active' : ''} onClick={() => setActiveTab('memo')}>
              <span className="material-icons">receipt_long</span>Memo
            </button>
            <button className="btn-add-tx" onClick={() => { setActiveTab('transactions'); setEntries([{ ...defaultEntry }]); }}>
              <span className="material-icons">add</span>
            </button>
            <button className={activeTab === 'calculator' ? 'active' : ''} onClick={() => setActiveTab('calculator')}>
              <span className="material-icons">calculate</span>Calculator
            </button>
            <button className={activeTab === 'settings' ? 'active' : ''} onClick={() => { setActiveTab('settings'); setSettingsView('menu'); }}>
              <span className="material-icons">settings</span>Settings
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

</body>
</html>
